name: Update Changelog

# When a (non-prerelease) GitHub Release is published, write its notes into
# CHANGELOG.md under the released version and commit the result back to main.
on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          # Admin PAT (org-level secret) used to push the changelog commit
          # straight to main. `main` is currently unprotected, but if branch
          # protection or a ruleset is ever added it must grant this token a
          # bypass, otherwise the push here will start failing.
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - name: Update CHANGELOG
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: "docs: update CHANGELOG for ${{ github.event.release.tag_name }}"
          file_pattern: CHANGELOG.md
