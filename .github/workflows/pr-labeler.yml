name: PR Labeler

# Adds a release-notes label from the Conventional Commits prefix of the PR title.
# The workflow does not check out code, so pull_request_target is safe here.
on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest

    steps:
      - name: Add label from title prefix
        uses: actions/github-script@v7
        with:
          script: |
            const labels = {
              feat: 'enhancement',
              fix: 'bug',
              docs: 'documentation',
              chore: 'maintenance',
              test: 'maintenance',
              ci: 'maintenance',
              build: 'maintenance',
              refactor: 'maintenance',
              perf: 'maintenance',
              style: 'maintenance',
            };
            const match = context.payload.pull_request.title.match(/^(\w+)(\([^)]*\))?!?:/);
            const label = match && labels[match[1]];
            if (!label) {
              core.info('The PR title has no known Conventional Commits prefix.');
              return;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
